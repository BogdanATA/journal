name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add macOS Intel target
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - name: Build (macOS universal)
        if: matrix.os == 'macos-latest'
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run tauri build

      - name: Stage artifacts and checksums (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
          cp -R src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app dist/
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Stage artifacts and checksums (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/
          $hashes = Get-FileHash -Algorithm SHA256 dist/*.msi, dist/*.exe
          $lines = $hashes | ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: journal-macos
          path: dist/*
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: journal-windows
          path: dist/*
          if-no-files-found: error
